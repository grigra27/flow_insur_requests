# Public aliases share a destination but use separate certificate lineages.
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name www.insflow.ru;

    ssl_certificate /etc/letsencrypt/live/insflow.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insflow.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://insflow.ru$request_uri;
    }
}

