# Enable gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/xml+rss
    application/json
    image/svg+xml;

# Upgrade the canonical public domain and the staff hosts in place.
server {
    listen 80;
    server_name insflow.ru zs.insflow.ru zs.insflow.tw1.su;

    # Security headers even for redirects
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Let's Encrypt challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS on the same host.
    # $host, not $server_name: $server_name is always the first name in the
    # list (insflow.ru), which sent zs.* traffic to the landing page.
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP server for the bare IP and any unknown Host - send to the landing page.
# Staff only use zs.insflow.ru; traffic by IP is mostly scanners, which should
# not be shown the app login.
server {
    listen 80 default_server;
    server_name 80.90.189.37 _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        return 301 https://insflow.ru/;
    }
}

# HTTPS server for the bare IP and any unknown SNI/Host - send to the landing page.
# Without it such requests fell into the first 443 block and reached Django,
# which served the app login under a certificate warning.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name 80.90.189.37 _;

    # Any valid cert will do: the name never matches, browsers warn regardless
    ssl_certificate /etc/letsencrypt/live/insflow.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insflow.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        return 301 https://insflow.ru/;
    }
}

# HTTPS server for main domain insflow.ru (landing page)
server {
    listen 443 ssl;
    http2 on;
    server_name insflow.ru;

    # SSL Configuration for insflow.ru
    ssl_certificate /etc/letsencrypt/live/insflow.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insflow.ru/privkey.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # SSL session optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/insflow.ru/chain.pem;
    
    # DNS resolver for OCSP
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Enhanced security headers for HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Статические файлы для всех доменов с оптимизацией производительности
    location /static/ {
        alias /app/staticfiles/;
        autoindex off;
        try_files $uri $uri/ =404;
        
        # Enable gzip for static files
        gzip_static on;
        
        # Default caching for static files
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Vary "Accept-Encoding";
        
        # CSS files - long-term caching with proper MIME type
        location ~* \.(css)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Content-Type "text/css; charset=utf-8";
            add_header Vary "Accept-Encoding";
        }
        
        # JavaScript files - long-term caching with proper MIME type
        location ~* \.(js)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Content-Type "application/javascript; charset=utf-8";
            add_header Vary "Accept-Encoding";
        }
        
        # Image files - long-term caching
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Vary "Accept-Encoding";
        }
        
        # Font files - long-term caching
        location ~* \.(woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
        }
        
        # HTML files - shorter caching
        location ~* \.(html|htm)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            add_header Vary "Accept-Encoding";
        }
    }

    # Документы доступны только после проверки сотрудника в Django (/media/).
    # Прямой внешний запрос к этому адресу всегда получает 404.
    location ^~ /_protected_media/ {
        internal;
        alias /app/media/;
        autoindex off;
        expires off;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Основное приложение (проксируем на контейнер web:8000)
    # Django будет обрабатывать маршрутизацию по доменам
    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;

        # Enhanced proxy buffering for performance
        proxy_buffering on;
        proxy_request_buffering on;
        proxy_buffers 16 256k;
        proxy_buffer_size 256k;
        proxy_busy_buffers_size 512k;
        proxy_temp_file_write_size 512k;
        
        # Timeouts optimization
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        
        # Client settings
        client_max_body_size 50M;
        client_body_buffer_size 256k;
        
        # Enable compression for dynamic content
        gzip_proxied any;
        
        # Additional security headers for dynamic content
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Performance headers
        add_header Vary "Accept-Encoding" always;
    }
}

