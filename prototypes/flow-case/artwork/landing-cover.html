<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>InsFlow — обложка главной страницы</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Helvetica Neue", Arial, sans-serif; }
    main {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      width: 1200px;
      height: 627px;
      overflow: hidden;
      background: #F8F8F3;
      color: #11182B;
    }
    .copy {
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      padding: 57px 0 52px 62px;
    }
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      font-weight: 700;
      font-size: 40px;
      line-height: 1;
      letter-spacing: -.055em;
    }
    .wordmark img { width: 44px; height: 44px; }
    h1 {
      margin: 0;
      font-weight: 600;
      font-size: 71px;
      letter-spacing: -.056em;
      line-height: 1.04;
    }
    h1 span { display: block; }
    .period { color: #FF7046; }
    .domain { margin: 0; font-size: 28px; letter-spacing: -.02em; }
    .sculpture {
      display: block;
      width: 100%;
      height: 627px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <main>
    <section class="copy">
      <div class="wordmark"><img src="../favicon.svg" alt="">InsFlow</div>
      <h1><span>Автоматизация</span> <span>страховых</span> <span>процессов<b class="period">.</b></span></h1>
      <p class="domain">insflow.ru</p>
    </section>
    <img class="sculpture" src="../../../static/img/landing/flow-sculpture.webp" alt="">
  </main>
</body>
</html>
