name: Django Checks and Smoke Tests

on:
  pull_request:

jobs:
  check-and-smoke:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        run: python manage.py check

      - name: Verify migration files are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run regression tests
        run: >-
          python manage.py test
          insurance_requests.tests
          backup.tests
          summaries.test_company_matcher
          summaries.test_templatetags
          summaries.test_offer_coverage_territory
          summaries.test_excel_integration
